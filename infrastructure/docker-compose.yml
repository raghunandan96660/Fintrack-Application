services:
  mysql:
    image: mysql:8.4
    container_name: fintrack-mysql

    environment:
      MYSQL_DATABASE: fintrack
      MYSQL_USER: fintrack
      MYSQL_PASSWORD: fintrack
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "127.0.0.1:3306:3306"

    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4.10
    container_name: fintrack-redis

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: fintrack-ollama

    ports:
      - "127.0.0.1:11434:11434"

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"

    volumes:
      - ollama-data:/root/.ollama

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

    command: serve


  localstack:
    image: localstack/localstack:2026.07.2
    container_name: fintrack-localstack

    ports:
      - "127.0.0.1:4566:4566"

    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket fintrack-imports > /dev/null 2>&1 && awslocal sqs get-queue-url --queue-name fintrack-transaction-processing > /dev/null 2>&1 && awslocal sqs get-queue-url --queue-name fintrack-import-jobs > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?LOCALSTACK_AUTH_TOKEN is required}
      PERSISTENCE: "1"

    volumes:
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - localstack-data:/var/lib/localstack

  api:
    build:
      context: ..
      dockerfile: services/api-service/Dockerfile

    image: fintrack-api:local

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: "local,deployment"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fintrack?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: fintrack
      SPRING_DATASOURCE_PASSWORD: fintrack

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://localstack:4566
      SPRING_CLOUD_AWS_S3_ENDPOINT: http://localstack:4566
      FINTRACK_S3_IMPORT_BUCKET: fintrack-imports

      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret-key-at-least-32-characters}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FINTRACK_ENVIRONMENT: local-container
      OLLAMA_API_URL: http://ollama:11434

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness > /dev/null" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

    stop_grace_period: 35s

  worker:
    build:
      context: ..
      dockerfile: services/worker-service/Dockerfile

    image: fintrack-worker:local

    environment:
      SPRING_PROFILES_ACTIVE: "local,deployment"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fintrack?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: fintrack
      SPRING_DATASOURCE_PASSWORD: fintrack

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SPRING_CLOUD_AWS_SQS_ENDPOINT: http://localstack:4566
      SPRING_CLOUD_AWS_S3_ENDPOINT: http://localstack:4566
      FINTRACK_S3_IMPORT_BUCKET: fintrack-imports

      FINTRACK_ENVIRONMENT: local-container
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 55s

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      api:
        condition: service_healthy

    stop_grace_period: 60s

  chatbot:
    build:
      context: ..
      dockerfile: chatbot-service/Dockerfile
      args:
        BUILD_DATE: '2026-10-01'

    image: fintrack-chatbot:local
    container_name: fintrack-chatbot

    ports:
     - "127.0.0.1:3001:3001"

    environment:
     OLLAMA_API_URL: http://ollama:11434
     NODE_ENV: production

    healthcheck:
     test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
     interval: 10s
     timeout: 5s
     retries: 3

    restart: unless-stopped


volumes:
  mysql-data:
  localstack-data:
  ollama-data:
